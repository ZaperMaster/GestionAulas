<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Aulas')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<header th:replace="fragments/layout :: userNav('edificios')"></header>
<main class="page">
  <nav class="breadcrumb" aria-label="Ruta">
    <a th:href="@{/menuUsuario}">Edificios</a>
    <svg class="icon"><use href="#i-chevron"/></svg>
    <a th:href="@{'/menuUsuario/edificio/' + ${planta.edificio.id} + '/plantas'}" th:text="${planta.edificio.descripcion}">Edificio</a>
    <svg class="icon"><use href="#i-chevron"/></svg>
    <span aria-current="page" th:text="${planta.descripcion}">Planta</span>
  </nav>
  <div class="page-header">
    <div>
      <p class="eyebrow">Paso 3 de 3</p>
      <h1>Elige un aula</h1>
      <p class="subtitle">Aulas de <b th:text="${planta.descripcion}">la planta</b> en <span th:text="${planta.edificio.descripcion}">el edificio</span>.</p>
    </div>
  </div>

  <div class="card empty" th:if="${#lists.isEmpty(aulas)}">
    <span class="empty-icon"><svg class="icon"><use href="#i-door"/></svg></span>
    <h3>No hay aulas en esta planta</h3>
    <p>Prueba con otra planta del edificio.</p>
    <a class="btn btn-secondary" th:href="@{'/menuUsuario/edificio/' + ${planta.edificio.id} + '/plantas'}"><svg class="icon"><use href="#i-arrow-left"/></svg>Volver a plantas</a>
  </div>

  <div class="grid-cards" th:unless="${#lists.isEmpty(aulas)}">
    <article class="card place-card" th:each="aula : ${aulas}">
      <div class="place-cover alt2"><svg class="icon"><use href="#i-door"/></svg></div>
      <div class="place-body">
        <div>
          <h3 th:text="${aula.nombreaula}">Aula</h3>
          <p class="muted" th:if="${aula.descripcion}" th:text="${aula.descripcion}" style="font-size: 14px; margin-top: 2px">Descripción</p>
        </div>
        <div class="meta">
          <span th:if="${aula.capacidad != null}"><svg class="icon"><use href="#i-users"/></svg><span th:text="${aula.capacidad} + ' plazas'">30 plazas</span></span>
          <span th:if="${aula.tipoAula != null}"><svg class="icon"><use href="#i-tag"/></svg><span th:text="${aula.tipoAula.nombretipo}">Tipo</span></span>
          <span th:if="${aula.nenchufes != null}"><svg class="icon"><use href="#i-plug"/></svg><span th:text="${aula.nenchufes} + ' enchufes'">0</span></span>
        </div>
        <div class="equip">
          <span class="badge badge-primary badge-plain" th:if="${aula.proyector}">Proyector</span>
          <span class="badge badge-primary badge-plain" th:if="${aula.smarttv}">Smart TV</span>
          <span class="badge badge-primary badge-plain" th:if="${aula.hdmi}">HDMI</span>
          <span class="badge badge-primary badge-plain" th:if="${aula.appletv}">Apple TV</span>
          <span class="badge badge-primary badge-plain" th:if="${aula.aireacondicionado}">Aire acondicionado</span>
        </div>
      </div>
      <div class="place-foot">
        <a class="btn btn-primary btn-sm" th:href="@{'/reservas/aula/' + ${aula.id}}"><svg class="icon"><use href="#i-calendar"/></svg>Reservar</a>
      </div>
    </article>
  </div>
</main>
</body>
</html>
