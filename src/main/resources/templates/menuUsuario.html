<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Reservar aula')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<header th:replace="fragments/layout :: userNav('edificios')"></header>
<main class="page">
  <div class="page-header">
    <div>
      <p class="eyebrow">Paso 1 de 3</p>
      <h1>Elige un edificio</h1>
      <p class="subtitle">Selecciona el edificio, después la planta y, por último, el aula que quieres reservar.</p>
    </div>
    <a class="btn btn-secondary" th:href="@{/misreservas}"><svg class="icon"><use href="#i-calendar"/></svg>Mis reservas</a>
  </div>

  <div class="card empty" th:if="${#lists.isEmpty(edificios)}">
    <span class="empty-icon"><svg class="icon"><use href="#i-building"/></svg></span>
    <h3>Todavía no hay edificios</h3>
    <p>Cuando la administración dé de alta edificios y aulas, aparecerán aquí.</p>
  </div>

  <div class="grid-cards" th:unless="${#lists.isEmpty(edificios)}">
    <a class="card place-card" th:each="ed, it : ${edificios}" th:href="@{'/menuUsuario/edificio/' + ${ed.id} + '/plantas'}" style="color: inherit; text-decoration: none">
      <div class="place-cover" th:classappend="${it.index % 3 == 1} ? 'alt' : (${it.index % 3 == 2} ? 'alt2' : '')">
        <svg class="icon"><use href="#i-building"/></svg>
      </div>
      <div class="place-body">
        <h3 th:text="${ed.descripcion}">Edificio</h3>
        <div class="meta">
          <span th:if="${ed.ubicacion}"><svg class="icon"><use href="#i-pin"/></svg><span th:text="${ed.ubicacion}">Ubicación</span></span>
          <span th:if="${ed.naulas != null}"><svg class="icon"><use href="#i-door"/></svg><span th:text="${ed.naulas} + ' aulas'">0 aulas</span></span>
          <span th:if="${ed.npuertasacceso != null}"><svg class="icon"><use href="#i-arrow-right"/></svg><span th:text="${ed.npuertasacceso} + ' accesos'">0 accesos</span></span>
        </div>
      </div>
      <div class="place-foot"><span class="btn btn-ghost btn-sm">Ver plantas<svg class="icon"><use href="#i-arrow-right"/></svg></span></div>
    </a>
  </div>
</main>
</body>
</html>
