<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Usuarios')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('usuarios')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Gestión</p>
          <h1>Usuarios</h1>
          <p class="subtitle">Personas registradas en la aplicación y su rol.</p>
        </div>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(usuarios)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-users"/></svg></span>
          <h3>No hay usuarios</h3>
          <p>Los usuarios aparecerán aquí cuando se registren.</p>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(usuarios)}">
          <table class="table">
            <thead><tr><th>Usuario</th><th>Email</th><th>DNI</th><th>Teléfono</th><th>Rol</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="usuario : ${usuarios}">
                <td><div class="cell-title" th:text="${usuario.nombre} + ' ' + (${usuario.apellido} ?: '')">Nombre</div><div class="id" th:text="'#' + ${usuario.id}">#1</div></td>
                <td th:text="${usuario.email}">email@correo.com</td>
                <td th:text="${usuario.dni} ?: '—'">12345678A</td>
                <td th:text="${usuario.telefono} ?: '—'">600000000</td>
                <td>
                  <span class="badge badge-primary" th:if="${usuario.tipoUsuario != null and usuario.tipoUsuario.id == 1}">Administrador</span>
                  <span class="badge" th:unless="${usuario.tipoUsuario != null and usuario.tipoUsuario.id == 1}">Usuario</span>
                </td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm" th:href="@{'/usuarios/editar/' + ${usuario.id}}"><svg class="icon"><use href="#i-edit"/></svg>Cambiar rol</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
