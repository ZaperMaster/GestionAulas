<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Reservas')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('reservas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Gestión</p>
          <h1>Reservas</h1>
          <p class="subtitle">Todas las reservas de aulas. Valida las pendientes para confirmarlas.</p>
        </div>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(reservas)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-calendar"/></svg></span>
          <h3>No hay reservas</h3>
          <p>Cuando los usuarios reserven aulas, aparecerán aquí.</p>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(reservas)}">
          <table class="table">
            <thead><tr><th>Aula</th><th>Usuario</th><th>Curso</th><th>Fechas</th><th>Horario</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="reserva : ${reservas}">
                <td><div class="cell-title" th:text="${reserva.aula.nombreaula}">A-101</div><div class="id" th:text="'#' + ${reserva.id}">#1</div></td>
                <td th:text="${reserva.usuario.email}">usuario@correo.com</td>
                <td th:text="${reserva.curso.descripcion}">Curso</td>
                <td>
                  <span th:text="${reserva.fechainicio != null ? #temporals.format(reserva.fechainicio, 'dd/MM/yyyy') : '—'}">01/01/2026</span>
                  <div class="cell-sub" th:if="${reserva.fechafin != null and reserva.fechafin != reserva.fechainicio}" th:text="'hasta ' + ${#temporals.format(reserva.fechafin, 'dd/MM/yyyy')}">hasta</div>
                </td>
                <td th:text="${reserva.horainicio != null ? reserva.horainicio + ' – ' + reserva.horafin : '—'}">09:00 – 11:00</td>
                <td>
                  <span class="badge badge-success" th:if="${reserva.validar == true}">Validada</span>
                  <span class="badge badge-warning" th:unless="${reserva.validar == true}">Pendiente</span>
                </td>
                <td class="actions">
                  <form th:action="@{/gestionarReservas/editar}" method="post">
                    <input type="hidden" name="id" th:value="${reserva.id}" />
                    <input type="hidden" name="validar" th:value="${reserva.validar != true}" />
                    <button type="submit" class="btn btn-secondary btn-sm" th:if="${reserva.validar != true}"><svg class="icon"><use href="#i-check"/></svg>Validar</button>
                    <button type="submit" class="btn btn-ghost btn-sm" th:if="${reserva.validar == true}">Quitar validación</button>
                  </form>
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/gestionarReservas/editar/' + ${reserva.id}}" title="Ver detalle" aria-label="Ver detalle"><svg class="icon"><use href="#i-arrow-right"/></svg></a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
