<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Cambiar rol')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('usuarios')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <a class="back-link" th:href="@{/usuarios}"><svg class="icon"><use href="#i-arrow-left"/></svg>Usuarios</a>
      <div class="page-header">
        <div>
          <h1>Cambiar rol</h1>
          <p class="subtitle">Los administradores pueden gestionar todo el centro y validar reservas.</p>
        </div>
      </div>

      <form class="card form-card" th:action="@{/usuarios/actualizar}" th:object="${usuario}" method="post" id="usuarioForm">
        <input type="hidden" th:field="*{id}" />
        <div class="card-body">
          <dl class="details">
            <div><dt>Nombre</dt><dd th:text="${usuario.nombre} + ' ' + (${usuario.apellido} ?: '')">Nombre</dd></div>
            <div><dt>Email</dt><dd th:text="${usuario.email}">email@correo.com</dd></div>
            <div><dt>DNI</dt><dd th:text="${usuario.dni} ?: '—'">12345678A</dd></div>
          </dl>
          <div class="form-section">
            <div class="field" style="max-width: 320px">
              <label for="tipoUsuarioId">Rol</label>
              <select id="tipoUsuarioId" name="tipoUsuarioId" required>
                <option value="3" th:selected="${usuario.tipoUsuario == null or usuario.tipoUsuario.id == 3}">Usuario</option>
                <option value="1" th:selected="${usuario.tipoUsuario != null and usuario.tipoUsuario.id == 1}">Administrador</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/usuarios}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
