<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Familias de cursos')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('famCursos')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Formación</p>
          <h1>Familias de cursos</h1>
          <p class="subtitle">Familias profesionales o áreas que agrupan los cursos.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/famCursos/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nueva familia</a>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(famCursos)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-folder"/></svg></span>
          <h3>Todavía no hay familias de cursos</h3>
          <p>Crea el primero con el botón de arriba.</p>
          <a class="btn btn-primary" th:href="@{/famCursos/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nueva familia</a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(famCursos)}">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Subuso de aula</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="fc : ${famCursos}">
                <td><div class="cell-title" th:text="${fc.descripcion}">Nombre</div><div class="id" th:text="'#' + ${fc.id}">#1</div></td>
                <td th:text="${fc.subUsoAula != null ? fc.subUsoAula.descripcion : '—'}">Subuso de aula</td>
                <td><span th:replace="fragments/layout :: estado(${fc.activo})"></span></td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/famCursos/editar/' + ${fc.id}}" title="Editar" aria-label="Editar"><svg class="icon"><use href="#i-edit"/></svg></a>
                  <form th:action="@{'/famCursos/borrar/' + ${fc.id}}" method="post" data-confirm="¿Borrar esta familia de cursos?">
                    <button type="submit" class="btn btn-ghost btn-sm btn-icon btn-icon-danger" title="Borrar" aria-label="Borrar"><svg class="icon"><use href="#i-trash"/></svg></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
