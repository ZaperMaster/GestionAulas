<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${subUsoAula.id != null} ? 'Editar subuso de aula' : 'Nuevo subuso de aula')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('subUsoAulas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <a class="back-link" th:href="@{/subUsoAulas}"><svg class="icon"><use href="#i-arrow-left"/></svg>Subusos de aula</a>
      <div class="page-header">
        <div>
          <h1 th:text="${subUsoAula.id != null} ? 'Editar subuso de aula' : 'Nuevo subuso de aula'">Nuevo subuso de aula</h1>
          <p class="subtitle">Detalle de cada uso de aula. Agrupan las familias de cursos.</p>
        </div>
      </div>

      <form class="card form-card" th:action="@{/subUsoAulas}" th:object="${subUsoAula}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="card-body">
          <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span>Revisa los datos del formulario.</span></div>
          <div class="form-grid">
            <div class="field">
              <label for="descripcion">Nombre</label>
              <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Ej: Clases teóricas" required />
            </div>
            <div class="field">
              <label for="usoAula">Uso de aula</label>
              <select id="usoAula" name="usoAula" required>
                <option value="" disabled th:selected="${subUsoAula.usoAula == null}">Selecciona una opción</option>
                <option th:each="u : ${usoAulas}" th:value="${u.id}" th:text="${u.descripcion}"
                        th:selected="${subUsoAula.usoAula != null and subUsoAula.usoAula.id == u.id}">Opción</option>
              </select>
              <span class="hint" th:if="${#lists.isEmpty(usoAulas)}">Primero tienes que <a th:href="@{/usoAulas/nuevo}">crear un uso de aula</a>.</span>
            </div>
            <div class="field full">
              <label th:replace="fragments/layout :: switchActivo(${subUsoAula.id == null}, ${subUsoAula.activo})"></label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/subUsoAulas}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
