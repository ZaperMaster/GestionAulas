<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${usoAula.id != null} ? 'Editar uso de aula' : 'Nuevo uso de aula')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('usoAulas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <a class="back-link" th:href="@{/usoAulas}"><svg class="icon"><use href="#i-arrow-left"/></svg>Usos de aula</a>
      <div class="page-header">
        <div>
          <h1 th:text="${usoAula.id != null} ? 'Editar uso de aula' : 'Nuevo uso de aula'">Nuevo uso de aula</h1>
          <p class="subtitle">Para qué se usan las aulas. Cada uso se divide en subusos.</p>
        </div>
      </div>

      <form class="card form-card" th:action="@{/usoAulas}" th:object="${usoAula}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="card-body">
          <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span>Revisa los datos del formulario.</span></div>
          <div class="form-grid">
            <div class="field full">
              <label for="descripcion">Nombre</label>
              <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Ej: Docencia" required />
            </div>
            <div class="field full">
              <label th:replace="fragments/layout :: switchActivo(${usoAula.id == null}, ${usoAula.activo})"></label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/usoAulas}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
