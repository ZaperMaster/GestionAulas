<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Edificios')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('edificios')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Infraestructura</p>
          <h1>Edificios</h1>
          <p class="subtitle">Edificios del centro. Cada edificio contiene plantas y estas, aulas.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/edificios/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo edificio</a>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(edificios)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-building"/></svg></span>
          <h3>No hay edificios</h3>
          <p>Crea el primer edificio para empezar a dar de alta plantas y aulas.</p>
          <a class="btn btn-primary" th:href="@{/edificios/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo edificio</a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(edificios)}">
          <table class="table">
            <thead><tr><th>Edificio</th><th>Ubicación</th><th class="num">Aulas</th><th class="num">Accesos</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="edificio : ${edificios}">
                <td><div class="cell-title" th:text="${edificio.descripcion}">Edificio</div><div class="id" th:text="'#' + ${edificio.id}">#1</div></td>
                <td th:text="${edificio.ubicacion} ?: '—'">Ubicación</td>
                <td class="num" th:text="${edificio.naulas} ?: '—'">0</td>
                <td class="num" th:text="${edificio.npuertasacceso} ?: '—'">0</td>
                <td><span th:replace="fragments/layout :: estado(${edificio.activo})"></span></td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/edificios/editar/' + ${edificio.id}}" title="Editar" aria-label="Editar"><svg class="icon"><use href="#i-edit"/></svg></a>
                  <form th:action="@{'/edificios/borrar/' + ${edificio.id}}" method="post" data-confirm="¿Borrar este edificio? También se borrarán sus plantas.">
                    <button type="submit" class="btn btn-ghost btn-sm btn-icon btn-icon-danger" title="Borrar" aria-label="Borrar"><svg class="icon"><use href="#i-trash"/></svg></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
