<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Cursos')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('cursos')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Formación</p>
          <h1>Cursos</h1>
          <p class="subtitle">Cursos que se imparten. Se eligen al hacer una reserva.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/cursos/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo curso</a>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(cursos)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-book"/></svg></span>
          <h3>Todavía no hay cursos</h3>
          <p>Crea el primero con el botón de arriba.</p>
          <a class="btn btn-primary" th:href="@{/cursos/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo curso</a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(cursos)}">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Familia de cursos</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="c : ${cursos}">
                <td><div class="cell-title" th:text="${c.descripcion}">Nombre</div><div class="id" th:text="'#' + ${c.id}">#1</div></td>
                <td th:text="${c.famCurso != null ? c.famCurso.descripcion : '—'}">Familia de cursos</td>
                <td><span th:replace="fragments/layout :: estado(${c.activo})"></span></td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/cursos/editar/' + ${c.id}}" title="Editar" aria-label="Editar"><svg class="icon"><use href="#i-edit"/></svg></a>
                  <form th:action="@{'/cursos/borrar/' + ${c.id}}" method="post" data-confirm="¿Borrar este curso?">
                    <button type="submit" class="btn btn-ghost btn-sm btn-icon btn-icon-danger" title="Borrar" aria-label="Borrar"><svg class="icon"><use href="#i-trash"/></svg></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
