<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Tipos de aula')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('tipoaulas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Infraestructura</p>
          <h1>Tipos de aula</h1>
          <p class="subtitle">Clasificación de las aulas: informática, laboratorio, salón de actos…</p>
        </div>
        <a class="btn btn-primary" th:href="@{/tipoaulas/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo tipo de aula</a>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(tipoAulas)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-tag"/></svg></span>
          <h3>Todavía no hay tipos de aula</h3>
          <p>Crea el primero con el botón de arriba.</p>
          <a class="btn btn-primary" th:href="@{/tipoaulas/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nuevo tipo de aula</a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(tipoAulas)}">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="ta : ${tipoAulas}">
                <td><div class="cell-title" th:text="${ta.nombretipo}">Nombre</div><div class="id" th:text="'#' + ${ta.id}">#1</div></td>
                <td class="cell-sub" th:text="${ta.descripcion} ?: '—'">Descripción</td>
                <td><span th:replace="fragments/layout :: estado(${ta.activo})"></span></td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/tipoaulas/editar/' + ${ta.id}}" title="Editar" aria-label="Editar"><svg class="icon"><use href="#i-edit"/></svg></a>
                  <form th:action="@{'/tipoaulas/borrar/' + ${ta.id}}" method="post" data-confirm="¿Borrar este tipo de aula?">
                    <button type="submit" class="btn btn-ghost btn-sm btn-icon btn-icon-danger" title="Borrar" aria-label="Borrar"><svg class="icon"><use href="#i-trash"/></svg></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
