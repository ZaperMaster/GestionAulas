<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Plantas')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('plantas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Infraestructura</p>
          <h1>Plantas</h1>
          <p class="subtitle">Plantas de cada edificio y el número de aulas que tienen.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/plantas/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nueva planta</a>
      </div>
      <div th:replace="fragments/layout :: flash"></div>

      <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(plantas)}">
          <span class="empty-icon"><svg class="icon"><use href="#i-layers"/></svg></span>
          <h3>No hay plantas</h3>
          <p>Crea una planta y asígnala a un edificio.</p>
          <a class="btn btn-primary" th:href="@{/plantas/nuevo}"><svg class="icon"><use href="#i-plus"/></svg>Nueva planta</a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(plantas)}">
          <table class="table">
            <thead><tr><th>Planta</th><th>Edificio</th><th class="num">Aulas docentes</th><th class="num">Auxiliares</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody>
              <tr th:each="planta : ${plantas}">
                <td><div class="cell-title" th:text="${planta.descripcion}">Planta</div><div class="id" th:text="'#' + ${planta.id}">#1</div></td>
                <td th:text="${planta.edificio != null ? planta.edificio.descripcion : '—'}">Edificio</td>
                <td class="num" th:text="${planta.naulasdocentes} ?: '—'">0</td>
                <td class="num" th:text="${planta.naulaauxiliares} ?: '—'">0</td>
                <td><span th:replace="fragments/layout :: estado(${planta.activo})"></span></td>
                <td class="actions">
                  <a class="btn btn-ghost btn-sm btn-icon" th:href="@{'/plantas/editar/' + ${planta.id}}" title="Editar" aria-label="Editar"><svg class="icon"><use href="#i-edit"/></svg></a>
                  <form th:action="@{'/plantas/borrar/' + ${planta.id}}" method="post" data-confirm="¿Borrar esta planta?">
                    <button type="submit" class="btn btn-ghost btn-sm btn-icon btn-icon-danger" title="Borrar" aria-label="Borrar"><svg class="icon"><use href="#i-trash"/></svg></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
