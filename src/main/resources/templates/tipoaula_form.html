<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${tipoAula.id != null} ? 'Editar tipo de aula' : 'Nuevo tipo de aula')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('tipoaulas')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <a class="back-link" th:href="@{/tipoaulas}"><svg class="icon"><use href="#i-arrow-left"/></svg>Tipos de aula</a>
      <div class="page-header">
        <div>
          <h1 th:text="${tipoAula.id != null} ? 'Editar tipo de aula' : 'Nuevo tipo de aula'">Nuevo tipo de aula</h1>
          <p class="subtitle">Clasificación de las aulas: informática, laboratorio, salón de actos…</p>
        </div>
      </div>

      <form class="card form-card" th:action="@{/tipoaulas}" th:object="${tipoAula}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="card-body">
          <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span>Revisa los datos del formulario.</span></div>
          <div class="form-grid">
            <div class="field full">
              <label for="nombretipo">Nombre</label>
              <input type="text" id="nombretipo" th:field="*{nombretipo}" placeholder="Ej: Laboratorio" required />
            </div>
            <div class="field full">
              <label for="descripcion">Descripción</label>
              <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Ej: Aula con bancos de trabajo y tomas de gas" />
            </div>
            <div class="field full">
              <label th:replace="fragments/layout :: switchActivo(${tipoAula.id == null}, ${tipoAula.activo})"></label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/tipoaulas}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
