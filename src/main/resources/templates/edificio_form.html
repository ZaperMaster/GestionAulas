<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${edificio.id != null} ? 'Editar edificio' : 'Nuevo edificio')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<div class="shell">
  <aside th:replace="fragments/layout :: adminNav('edificios')"></aside>
  <div>
    <header th:replace="fragments/layout :: adminTopbar"></header>
    <main class="content">
      <a class="back-link" th:href="@{/edificios}"><svg class="icon"><use href="#i-arrow-left"/></svg>Edificios</a>
      <div class="page-header">
        <div>
          <h1 th:text="${edificio.id != null} ? 'Editar edificio' : 'Nuevo edificio'">Nuevo edificio</h1>
          <p class="subtitle">Datos generales del edificio.</p>
        </div>
      </div>

      <form class="card form-card" th:action="@{/edificios}" th:object="${edificio}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="card-body">
          <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span>Revisa los datos del formulario.</span></div>
          <div class="form-grid">
            <div class="field full">
              <label for="descripcion">Nombre</label>
              <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Ej: Edificio principal" required />
            </div>
            <div class="field full">
              <label for="ubicacion">Ubicación</label>
              <input type="text" id="ubicacion" th:field="*{ubicacion}" placeholder="Ej: Campus norte, calle Mayor 1" required />
            </div>
            <div class="field">
              <label for="naulas">Número de aulas</label>
              <input type="number" id="naulas" th:field="*{naulas}" placeholder="Ej: 10" min="0" />
            </div>
            <div class="field">
              <label for="npuertasacceso">Puertas de acceso</label>
              <input type="number" id="npuertasacceso" th:field="*{npuertasacceso}" placeholder="Ej: 2" min="0" />
            </div>
            <div class="field full">
              <label th:replace="fragments/layout :: switchActivo(${edificio.id == null}, ${edificio.activo})"></label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/edificios}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
