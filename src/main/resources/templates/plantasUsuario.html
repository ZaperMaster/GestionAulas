<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Plantas')"></head>
<body>
<svg th:replace="fragments/layout :: icons"></svg>
<header th:replace="fragments/layout :: userNav('edificios')"></header>
<main class="page">
  <nav class="breadcrumb" aria-label="Ruta">
    <a th:href="@{/menuUsuario}">Edificios</a>
    <svg class="icon"><use href="#i-chevron"/></svg>
    <span aria-current="page" th:text="${edificio.descripcion}">Edificio</span>
  </nav>
  <div class="page-header">
    <div>
      <p class="eyebrow">Paso 2 de 3</p>
      <h1>Elige una planta</h1>
      <p class="subtitle">Plantas de <b th:text="${edificio.descripcion}">Edificio</b><span th:if="${edificio.ubicacion}" th:text="' · ' + ${edificio.ubicacion}"></span></p>
    </div>
  </div>

  <div class="card empty" th:if="${#lists.isEmpty(plantas)}">
    <span class="empty-icon"><svg class="icon"><use href="#i-layers"/></svg></span>
    <h3>Este edificio no tiene plantas</h3>
    <p>Prueba con otro edificio.</p>
    <a class="btn btn-secondary" th:href="@{/menuUsuario}"><svg class="icon"><use href="#i-arrow-left"/></svg>Volver a edificios</a>
  </div>

  <div class="grid-cards" th:unless="${#lists.isEmpty(plantas)}">
    <a class="card place-card" th:each="pl : ${plantas}" th:href="@{'/menuUsuario/planta/' + ${pl.id} + '/aulas'}" style="color: inherit; text-decoration: none">
      <div class="place-cover alt"><svg class="icon"><use href="#i-layers"/></svg></div>
      <div class="place-body">
        <h3 th:text="${pl.descripcion}">Planta</h3>
        <div class="meta">
          <span th:if="${pl.naulasdocentes != null}"><svg class="icon"><use href="#i-door"/></svg><span th:text="${pl.naulasdocentes} + ' aulas docentes'">0</span></span>
          <span th:if="${pl.naulaauxiliares != null}"><svg class="icon"><use href="#i-grid"/></svg><span th:text="${pl.naulaauxiliares} + ' auxiliares'">0</span></span>
        </div>
      </div>
      <div class="place-foot"><span class="btn btn-ghost btn-sm">Ver aulas<svg class="icon"><use href="#i-arrow-right"/></svg></span></div>
    </a>
  </div>
</main>
</body>
</html>
