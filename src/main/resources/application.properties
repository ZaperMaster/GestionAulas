# Puerto de escucha
server.port=${PORT:8080}

# Conexión con la base de datos (se puede cambiar con variables de entorno)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestoraulas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# Respetar mayúsculas y minúsculas en los nombres de tablas y columnas
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Administrador inicial (solo se crea si no existe ninguno)
app.admin.email=${ADMIN_EMAIL:admin@gestionaulas.local}
app.admin.password=${ADMIN_PASSWORD:}
