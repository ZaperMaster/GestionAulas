# Dependabot: avisa y abre PRs cuando hay versiones nuevas o vulnerabilidades en las dependencias.
# Las actualizaciones se agrupan en un único PR al mes por ecosistema para no llenar el repo de PRs.
version: 2
updates:
  # Dependencias de Maven (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # Saltar de versión mayor (por ejemplo, Spring Boot 2 → 3) exige migrar el código
      # (javax → jakarta), así que solo se proponen versiones menores y parches.
      # Las alertas de vulnerabilidades se siguen mostrando en la pestaña Security.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en los flujos de GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns: ["*"]
