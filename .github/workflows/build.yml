name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven:
    name: Compilar con Maven (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, ejecutar los tests y empaquetar
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
